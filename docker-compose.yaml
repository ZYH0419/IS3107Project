x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: smartcity-airflow:3.1.7
  env_file:
    - .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW_CONFIG: "/opt/airflow/config/airflow.cfg"

    LTA_ACCOUNT_KEY: ${LTA_ACCOUNT_KEY}
    SUPABASE_DB_URI: ${SUPABASE_DB_URI}

    RAW_DATA_DIR: ${RAW_DATA_DIR:-/opt/airflow/raw_data}

    R2_ENDPOINT: ${R2_ENDPOINT}
    R2_ACCESS_KEY: ${R2_ACCESS_KEY}
    R2_SECRET_KEY: ${R2_SECRET_KEY}
    R2_BUCKET: ${R2_BUCKET}

    R2_RAW_PREFIX: ${R2_RAW_PREFIX:-traffic_speed/}
    R2_CLEANED_PREFIX: ${R2_CLEANED_PREFIX:-traffic_speed_cleaned/}
    R2_FEATURES_PREFIX: ${R2_FEATURES_PREFIX:-features/training_data/}

    R2_RAINFALL_READINGS_PREFIX: ${R2_RAINFALL_READINGS_PREFIX:-rainfall_readings/}
    R2_WEATHER_STATIONS_PREFIX: ${R2_WEATHER_STATIONS_PREFIX:-weather_stations/}
    R2_TAXI_PREFIX: ${R2_TAXI_PREFIX:-taxi_availability/}
    R2_INCIDENTS_PREFIX: ${R2_INCIDENTS_PREFIX:-traffic_incidents/}
    R2_POI_PREFIX: ${R2_POI_PREFIX:-poi/}
    R2_WEATHER_EVENTS_PREFIX: ${R2_WEATHER_EVENTS_PREFIX:-weather_events/}

    WRITE_LATEST_RAINFALL_ALIAS: ${WRITE_LATEST_RAINFALL_ALIAS:-true}
    WRITE_LATEST_TAXI_ALIAS: ${WRITE_LATEST_TAXI_ALIAS:-true}
    WRITE_LATEST_INCIDENTS_ALIAS: ${WRITE_LATEST_INCIDENTS_ALIAS:-true}
    WRITE_LATEST_POI_ALIAS: ${WRITE_LATEST_POI_ALIAS:-true}
    WRITE_LATEST_WEATHER_EVENTS_ALIAS: ${WRITE_LATEST_WEATHER_EVENTS_ALIAS:-true}
    WRITE_LATEST_FEATURE_ALIAS: ${WRITE_LATEST_FEATURE_ALIAS:-true}

    RAINFALL_REMAP_ALL: ${RAINFALL_REMAP_ALL:-false}
    RECENT_RETENTION_HOURS: ${RECENT_RETENTION_HOURS:-24}
    PRIMARY_WINDOW_DAYS: ${PRIMARY_WINDOW_DAYS:-3}
    ROAD_NEIGHBOR_COORD_DECIMALS: ${ROAD_NEIGHBOR_COORD_DECIMALS:-5}

    POI_PLACE_QUERY: ${POI_PLACE_QUERY:-Singapore}

  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./config:/opt/airflow/config
    - ./plugins:/opt/airflow/plugins
    - ./raw_data:/opt/airflow/raw_data
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    container_name: airflow_postgres
    restart: always
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins /opt/airflow/config /opt/airflow/raw_data
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins /opt/airflow/config /opt/airflow/raw_data
        /entrypoint airflow db migrate
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: "${_AIRFLOW_WWW_USER_USERNAME:-airflow}"
      _AIRFLOW_WWW_USER_PASSWORD: "${_AIRFLOW_WWW_USER_PASSWORD:-airflow}"
    user: "0:0"

  airflow-apiserver:
    <<: *airflow-common
    container_name: airflow_apiserver
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow_dag_processor
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow_triggerer
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type TriggererJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  streamlit:
    image: python:3.10-slim
    container_name: streamlit_app
    restart: unless-stopped
    env_file:
      - .env
    working_dir: /app
    volumes:
      - ./:/app
      - ./requirements-streamlit.txt:/requirements-streamlit.txt
    ports:
      - "8501:8501"
    command: >
      bash -c "pip install -r /requirements-streamlit.txt && exec streamlit run streamlit_app/app.py --server.address=0.0.0.0 --server.port=8501"

volumes:
  postgres-db-volume: