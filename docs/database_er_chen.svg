<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1200" viewBox="0 0 1900 1200">
  <defs>
    <style>
      .entity { fill: #d8f3a3; stroke: #5f7f1f; stroke-width: 2.5; }
      .view { fill: #eaf9c8; stroke: #5f7f1f; stroke-width: 2.5; stroke-dasharray: 8 6; }
      .relationship { fill: #c9db49; stroke: #5f7f1f; stroke-width: 2.5; }
      .attribute { fill: #e6f8b8; stroke: #5f7f1f; stroke-width: 2; }
      .line { stroke: #526b27; stroke-width: 2; fill: none; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 20px; fill: #22300d; text-anchor: middle; dominant-baseline: middle; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #22300d; text-anchor: middle; dominant-baseline: middle; }
      .card { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #22300d; font-weight: bold; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect x="1" y="1" width="1898" height="1198" fill="#fbfff0" stroke="#b63a3a" stroke-width="2"/>
  <!-- Road segments -->
  <rect x="90" y="260" width="210" height="78" class="entity"/>
  <text x="195" y="299" class="card">Road Segment</text>

  <ellipse cx="60" cy="170" rx="55" ry="28" class="attribute"/>
  <text x="60" y="170" class="small" text-decoration="underline">link_id</text>
  <line x1="92" y1="193" x2="160" y2="260" class="line"/>

  <ellipse cx="190" cy="140" rx="75" ry="28" class="attribute"/>
  <text x="190" y="140" class="small">road_name</text>
  <line x1="190" y1="168" x2="190" y2="260" class="line"/>

  <ellipse cx="330" cy="230" rx="85" ry="28" class="attribute"/>
  <text x="330" y="230" class="small">road_category</text>
  <line x1="295" y1="252" x2="235" y2="260" class="line"/>

  <ellipse cx="95" cy="390" rx="96" ry="28" class="attribute"/>
  <text x="95" y="390" class="small">start/end lat</text>
  <line x1="130" y1="366" x2="155" y2="338" class="line"/>

  <ellipse cx="305" cy="440" rx="96" ry="28" class="attribute"/>
  <text x="305" y="440" class="small">start/end lon</text>
  <line x1="275" y1="415" x2="230" y2="338" class="line"/>

  <!-- Traffic latest -->
  <rect x="520" y="110" width="250" height="78" class="entity"/>
  <text x="645" y="149" class="card">Traffic Speed Latest</text>

  <ellipse cx="475" cy="52" rx="72" ry="26" class="attribute"/>
  <text x="475" y="52" class="small" text-decoration="underline">link_id</text>
  <line x1="520" y1="74" x2="590" y2="110" class="line"/>

  <ellipse cx="650" cy="42" rx="90" ry="26" class="attribute"/>
  <text x="650" y="42" class="small">collected_at</text>
  <line x1="650" y1="68" x2="652" y2="110" class="line"/>

  <ellipse cx="835" cy="70" rx="85" ry="26" class="attribute"/>
  <text x="835" y="70" class="small">speed_band</text>
  <line x1="792" y1="92" x2="725" y2="110" class="line"/>

  <polygon points="385,149 450,104 515,149 450,194" class="relationship"/>
  <text x="450" y="149" class="small">has latest</text>
  <line x1="300" y1="272" x2="424" y2="181" class="line"/>
  <line x1="515" y1="149" x2="520" y2="149" class="line"/>
  <text x="330" y="232" class="small">1</text>
  <text x="505" y="125" class="small">0..1</text>

  <!-- Traffic recent -->
  <rect x="520" y="320" width="250" height="78" class="entity"/>
  <text x="645" y="359" class="card">Traffic Speed Recent</text>

  <ellipse cx="500" cy="455" rx="90" ry="26" class="attribute"/>
  <text x="500" y="455" class="small" text-decoration="underline">collected_at</text>
  <line x1="540" y1="432" x2="590" y2="398" class="line"/>

  <ellipse cx="500" cy="520" rx="65" ry="26" class="attribute"/>
  <text x="500" y="520" class="small" text-decoration="underline">link_id</text>
  <line x1="535" y1="497" x2="652" y2="398" class="line"/>

  <ellipse cx="850" cy="430" rx="105" ry="26" class="attribute"/>
  <text x="850" y="430" class="small">speed/min/max</text>
  <line x1="795" y1="410" x2="715" y2="398" class="line"/>

  <polygon points="385,359 450,314 515,359 450,404" class="relationship"/>
  <text x="450" y="359" class="small">has snapshots</text>
  <line x1="300" y1="320" x2="418" y2="348" class="line"/>
  <line x1="515" y1="359" x2="520" y2="359" class="line"/>
  <text x="330" y="323" class="small">1</text>
  <text x="505" y="337" class="small">M</text>

  <!-- Traffic 15 min -->
  <rect x="520" y="575" width="250" height="78" class="entity"/>
  <text x="645" y="614" class="card">Traffic Speed 15min</text>

  <ellipse cx="490" cy="720" rx="96" ry="26" class="attribute"/>
  <text x="490" y="720" class="small" text-decoration="underline">interval_start</text>
  <line x1="535" y1="697" x2="590" y2="653" class="line"/>

  <ellipse cx="650" cy="760" rx="65" ry="26" class="attribute"/>
  <text x="650" y="760" class="small" text-decoration="underline">link_id</text>
  <line x1="650" y1="734" x2="650" y2="653" class="line"/>

  <ellipse cx="825" cy="710" rx="105" ry="26" class="attribute"/>
  <text x="825" y="710" class="small">avg/min/max speed</text>
  <line x1="783" y1="688" x2="715" y2="653" class="line"/>

  <polygon points="600,485 665,440 730,485 665,530" class="relationship"/>
  <text x="665" y="485" class="small">aggregates</text>
  <line x1="665" y1="398" x2="665" y2="440" class="line"/>
  <line x1="665" y1="530" x2="665" y2="575" class="line"/>
  <text x="685" y="420" class="small">M</text>
  <text x="690" y="555" class="small">1</text>

  <!-- Weather station -->
  <rect x="1070" y="160" width="230" height="78" class="entity"/>
  <text x="1185" y="199" class="card">Weather Station</text>

  <ellipse cx="1010" cy="80" rx="85" ry="26" class="attribute"/>
  <text x="1010" y="80" class="small" text-decoration="underline">station_id</text>
  <line x1="1050" y1="102" x2="1130" y2="160" class="line"/>

  <ellipse cx="1195" cy="66" rx="90" ry="26" class="attribute"/>
  <text x="1195" y="66" class="small">station_name</text>
  <line x1="1190" y1="92" x2="1185" y2="160" class="line"/>

  <ellipse cx="1350" cy="120" rx="75" ry="26" class="attribute"/>
  <text x="1350" y="120" class="small">lat / lon</text>
  <line x1="1310" y1="142" x2="1250" y2="160" class="line"/>

  <!-- Mapping relationship -->
  <polygon points="785,285 870,225 955,285 870,345" class="relationship"/>
  <text x="870" y="275" class="small">mapped</text>
  <text x="870" y="298" class="small">to nearest</text>
  <line x1="300" y1="299" x2="785" y2="285" class="line"/>
  <line x1="955" y1="270" x2="1070" y2="220" class="line"/>
  <text x="365" y="282" class="small">1</text>
  <text x="1035" y="220" class="small">1</text>

  <ellipse cx="1070" cy="395" rx="95" ry="26" class="attribute"/>
  <text x="1070" y="395" class="small">distance_km</text>
  <line x1="1010" y1="374" x2="870" y2="345" class="line"/>

  <!-- Rainfall readings -->
  <rect x="1485" y="160" width="230" height="78" class="entity"/>
  <text x="1600" y="199" class="card">Rainfall Reading</text>

  <ellipse cx="1450" cy="55" rx="115" ry="26" class="attribute"/>
  <text x="1450" y="55" class="small" text-decoration="underline">reading_timestamp</text>
  <line x1="1500" y1="78" x2="1548" y2="160" class="line"/>

  <ellipse cx="1600" cy="112" rx="78" ry="26" class="attribute"/>
  <text x="1600" y="112" class="small" text-decoration="underline">station_id</text>
  <line x1="1600" y1="138" x2="1600" y2="160" class="line"/>

  <ellipse cx="1760" cy="55" rx="85" ry="26" class="attribute"/>
  <text x="1760" y="55" class="small">rainfall_mm</text>
  <line x1="1720" y1="78" x2="1660" y2="160" class="line"/>

  <polygon points="1355,199 1420,154 1485,199 1420,244" class="relationship"/>
  <text x="1420" y="199" class="small">records</text>
  <line x1="1300" y1="199" x2="1355" y2="199" class="line"/>
  <line x1="1485" y1="199" x2="1485" y2="199" class="line"/>
  <text x="1328" y="184" class="small">1</text>
  <text x="1460" y="184" class="small">M</text>

  <!-- Rainfall traffic views -->
  <rect x="875" y="535" width="250" height="92" class="view"/>
  <text x="1000" y="570" class="card">Traffic Rainfall</text>
  <text x="1000" y="596" class="card">Latest / Recent View</text>

  <ellipse cx="965" cy="510" rx="70" ry="24" class="attribute"/>
  <text x="965" y="510" class="small">speed fields</text>
  <line x1="980" y1="532" x2="980" y2="535" class="line"/>

  <ellipse cx="1090" cy="455" rx="85" ry="24" class="attribute"/>
  <text x="1090" y="455" class="small">rainfall fields</text>
  <line x1="1060" y1="478" x2="1032" y2="535" class="line"/>

  <polygon points="775,565 825,530 875,565 825,600" class="relationship"/>
  <text x="825" y="565" class="small">joins</text>
  <line x1="770" y1="359" x2="835" y2="526" class="line"/>
  <line x1="770" y1="614" x2="835" y2="604" class="line"/>
  <line x1="875" y1="565" x2="875" y2="580" class="line"/>
  <line x1="1420" y1="244" x2="1080" y2="535" class="line"/>
  <text x="795" y="435" class="small">M</text>

  <!-- Training data -->
  <rect x="1215" y="530" width="260" height="92" class="entity"/>
  <text x="1345" y="564" class="card">Traffic Rainfall</text>
  <text x="1345" y="590" class="card">Training Data</text>

  <ellipse cx="1195" cy="690" rx="92" ry="26" class="attribute"/>
  <text x="1195" y="690" class="small" text-decoration="underline">collected_at</text>
  <line x1="1240" y1="667" x2="1300" y2="622" class="line"/>

  <ellipse cx="1345" cy="740" rx="65" ry="26" class="attribute"/>
  <text x="1345" y="740" class="small" text-decoration="underline">link_id</text>
  <line x1="1346" y1="714" x2="1347" y2="622" class="line"/>

  <ellipse cx="1510" cy="690" rx="95" ry="26" class="attribute"/>
  <text x="1510" y="690" class="small">features + target</text>
  <line x1="1465" y1="667" x2="1408" y2="622" class="line"/>

  <polygon points="1130,576 1170,540 1210,576 1170,612" class="relationship"/>
  <text x="1170" y="576" class="small">collects</text>
  <line x1="1125" y1="576" x2="1130" y2="576" class="line"/>
  <line x1="1210" y1="576" x2="1215" y2="576" class="line"/>
  <text x="1136" y="558" class="small">1</text>
  <text x="1278" y="558" class="small">M</text>

  <!-- Model registry -->
  <rect x="1580" y="505" width="245" height="92" class="entity"/>
  <text x="1702" y="539" class="card">Congestion Model</text>
  <text x="1702" y="565" class="card">Registry</text>

  <ellipse cx="1560" cy="430" rx="78" ry="26" class="attribute"/>
  <text x="1560" y="430" class="small" text-decoration="underline">model_id</text>
  <line x1="1610" y1="452" x2="1670" y2="505" class="line"/>

  <ellipse cx="1705" cy="380" rx="75" ry="26" class="attribute"/>
  <text x="1705" y="380" class="small">metrics</text>
  <line x1="1705" y1="406" x2="1708" y2="505" class="line"/>

  <ellipse cx="1815" cy="450" rx="75" ry="26" class="attribute"/>
  <text x="1815" y="450" class="small">artifact</text>
  <line x1="1790" y1="472" x2="1765" y2="505" class="line"/>

  <polygon points="1485,576 1530,540 1575,576 1530,612" class="relationship"/>
  <text x="1530" y="576" class="small">trains</text>
  <line x1="1475" y1="576" x2="1485" y2="576" class="line"/>
  <line x1="1575" y1="576" x2="1580" y2="576" class="line"/>
  <text x="1490" y="555" class="small">M</text>
  <text x="1574" y="555" class="small">1</text>

  <!-- Predictions -->
  <rect x="1515" y="855" width="275" height="92" class="entity"/>
  <text x="1652" y="889" class="card">Congestion</text>
  <text x="1652" y="915" class="card">Prediction</text>

  <ellipse cx="1470" cy="1015" rx="80" ry="26" class="attribute"/>
  <text x="1470" y="1015" class="small" text-decoration="underline">target_time</text>
  <line x1="1510" y1="992" x2="1585" y2="947" class="line"/>

  <ellipse cx="1635" cy="1065" rx="65" ry="26" class="attribute"/>
  <text x="1635" y="1065" class="small" text-decoration="underline">link_id</text>
  <line x1="1638" y1="1039" x2="1645" y2="947" class="line"/>

  <ellipse cx="1790" cy="980" rx="90" ry="26" class="attribute"/>
  <text x="1790" y="980" class="small">predicted score</text>
  <line x1="1745" y1="958" x2="1696" y2="947" class="line"/>

  <polygon points="1625,705 1695,660 1765,705 1695,750" class="relationship"/>
  <text x="1695" y="705" class="small">produces</text>
  <line x1="1700" y1="597" x2="1696" y2="660" class="line"/>
  <line x1="1692" y1="750" x2="1665" y2="855" class="line"/>
  <text x="1718" y="635" class="small">1</text>
  <text x="1690" y="830" class="small">M</text>

  <polygon points="1275,865 1350,815 1425,865 1350,915" class="relationship"/>
  <text x="1350" y="855" class="small">predicted</text>
  <text x="1350" y="878" class="small">for</text>
  <line x1="300" y1="338" x2="1275" y2="865" class="line"/>
  <line x1="1425" y1="865" x2="1515" y2="890" class="line"/>
  <text x="390" y="390" class="small">1</text>
  <text x="1485" y="865" class="small">M</text>

  <!-- Small legend -->
  <rect x="70" y="1040" width="570" height="95" fill="#f3ffd7" stroke="#9ab45b" stroke-width="2"/>
  <text x="355" y="1066" class="card">Simplification Notes</text>
  <text x="355" y="1094" class="small">traffic_rainfall_latest and traffic_rainfall_recent are views, not physical tables.</text>
  <text x="355" y="1121" class="small">Rainfall is joined by nearest weather station and closest timestamp within about 10 minutes.</text>
</svg>
